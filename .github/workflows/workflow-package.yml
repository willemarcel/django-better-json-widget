name: package

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

env:
  PIP_NO_CACHE_DIR: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        django-version: ["~=3.2.0", "~=4.0.0", "~=4.1.0", "~=4.2.0", "~=5.0.0", "~=5.1.0", "~=6.0.0"]
        exclude:
          # Django 5.0+ requires Python 3.10+
          - python-version: '3.8'
            django-version: "~=5.0.0"
          - python-version: '3.9'
            django-version: "~=5.0.0"
          - python-version: '3.8'
            django-version: "~=5.1.0"
          - python-version: '3.9'
            django-version: "~=5.1.0"
          - python-version: '3.8'
            django-version: "~=6.0.0"
          - python-version: '3.9'
            django-version: "~=6.0.0"

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.13.6"

      - name: Load cached venv
        id: cached-uv-dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ matrix.python-version }}-django${{ matrix.django-version }}-${{ hashFiles('**/uv.lock') }}

      - name: Install dependencies
        run: uv sync

      - name: Install Django
        run: uv pip install django${{ matrix.django-version }}

      - name: Run checks
        run: make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          # token: ${{ secrets.CODECOV_TOKEN }} # not required for public repos

  # Releasing package, when in `master` branch or tag
  release-package:
    runs-on: ubuntu-latest
    needs: [checks]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.13.6"

      - name: Add version to environment vars
        run: |
          PROJECT_VERSION=$(uv project version)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_ENV

      - name: Check if tag version matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG=${GITHUB_REF:10}
          echo $TAG
          echo $PROJECT_VERSION
          if [[ "$TAG" != "$PROJECT_VERSION" ]]; then exit 1; fi

      - name: Build and publish (dry-run)
        if: github.actor != 'dependabot[bot]'
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv build --no-publish

      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
