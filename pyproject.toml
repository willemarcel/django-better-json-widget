[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-better-json-widget"
version = "0.5.0"
description = "Better JSON Widget for Django Admin"
readme = "README.md"
license = "MIT"
authors = [
    { name = "yakimka" }
]
requires-python = ">=3.9"
dependencies = [
    "django>=3.2",
]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 6.0",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/yakimka/django-better-json-widget"

[tool.hatch.build.targets.wheel]
packages = ["better_json_widget"]

[dependency-groups]
dev = [
    "black>=24.0.0",
    "darglint>=1.8.1",
    "dlint>=0.15.0",
    "flake8>=7.0.0",
    "flake8-aaa>=0.17.0",
    "flake8-bandit>=4.1.0",
    "flake8-broken-line>=1.0.0",
    "flake8-bugbear>=24.0.0",
    "flake8-comprehensions>=3.15.0",
    "flake8-debugger>=4.1.2",
    "flake8-docstrings>=1.7.0",
    "flake8-eradicate>=1.5.0",
    "flake8-executable>=2.1.3",
    "flake8-fixme>=1.1.1",
    "flake8-implicit-str-concat>=0.5.0",
    "flake8-pytest-style>=2.0.0",
    "flake8-quotes>=3.4.0",
    "flake8-rst-docstrings>=0.3.0",
    "flake8-simplify>=0.21.0",
    "flake8-string-format>=0.3.0",
    "flake8-type-checking>=3.0.0",
    "isort>=5.13.0",
    "mypy>=1.10.0",
    "pep8-naming>=0.14.0",
    "pre-commit>=3.7.0",
    "pylint>=3.3.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-randomly>=3.15.0",
    "safety>=3.2.0",
    "tomli>=2.0.1",
    "yamllint>=1.35.0",
    "django-stubs>=5.0.0",
]

[tool.isort]
# isort configuration:
# https://github.com/timothycrosley/isort/wiki/isort-Settings
profile = "black"
include_trailing_comma = true
use_parentheses = true
# See https://github.com/timothycrosley/isort#multi-line-output-modes
multi_line_output = 3
line_length = 80

[tool.black]
line-length = 80

[tool.pytest.ini_options]
# Directories that are not visited by pytest collector:
norecursedirs = ["*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__"]

# Strict `@xfail` by default:
xfail_strict = true

# Extra options:
addopts = [
  "--strict-markers",
  "--strict-config",
  "--tb=short",
  "--doctest-modules",
  "--cov",
  "--cov-report=term:skip-covered",
  "--cov-report=term-missing",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-branch",
  "--cov-fail-under=100",
]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
]

[tool.mypy]
# mypy configurations: https://mypy.readthedocs.io/en/latest/config_file.html
allow_redefinition = false
check_untyped_defs = true
disallow_any_explicit = false
disallow_any_generics = false
disallow_untyped_calls = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
implicit_reexport = false
local_partial_types = true
no_implicit_optional = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pylint.messages_control]
max-line-length = 80
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "too-many-return-statements",
    "duplicate-code",
    "protected-access",
    "redefined-outer-name",
]
