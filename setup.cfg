[flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = default
show-source = true
statistics = true

# flake8-type-checking
# https://github.com/snok/flake8-type-checking#choosing-how-to-handle-forward-references
enable-extensions = TC, TC1

# darglint configuration:
# https://github.com/terrencepreilly/darglint
strictness = long
docstring-style = numpy

# flake8-quotes
inline-quotes = "

# Plugins:
max-complexity = 6
max-line-length = 80

# flake8-typing-imports
min_python_version = 3.10.0

# flake8-type-checking
type-checking-exempt-modules = typing,typing_extensions
type-checking-pydantic-enabled = false
# type-checking-pydantic-enabled-baseclass-passlist = NamedTuple,TypedDict
type-checking-fastapi-enabled = false
type-checking-fastapi-dependency-support-enabled = false
type-checking-cattrs-enabled = false

# flake8-pytest-style
pytest-parametrize-names-type = csv

# Disable some pydocstyle checks:
# Exclude some pydoctest checks globally:
ignore =
         # pydocstyle
         D1,
         D400,
         D401,

         # darglint
         DAR103,
         DAR203,

         # flake8-pie
         PIE786,

         # flake8-pytest-style
         PT011,

         # flake8-rst-docstrings
         RST201,
         RST203,
         RST301,
         RST303,
         RST304,

         # flake8-fixme
         T101,

         # pycodestyle
         W504,

# Excluding some directories:
exclude =
  .git
  __pycache__
  .venv
  .eggs
  *.egg
  **/migrations/*.py

# Ignoring some errors in some files:
per-file-ignores =
  # Enable `assert` keyword and magic numbers for tests:
  tests/*.py: S101,
